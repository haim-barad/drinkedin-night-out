name: Publish to MCP registry

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish. Anything else validates only.'
        required: false
        default: ''

permissions:
  contents: read

env:
  PUBLISHER_VERSION: v1.8.1
  SERVER_NAME: io.github.haim-barad/drinkedin-night-out

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: mcp-registry-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write   # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@v4

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/${PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz" -o publisher.tar.gz
          tar xzf publisher.tar.gz mcp-publisher
          ./mcp-publisher --version

      - name: Validate
        run: ./mcp-publisher validate server.json

      - name: Authenticate (GitHub OIDC)
        if: inputs.confirm == 'publish'
        run: ./mcp-publisher login github-oidc

      - name: Publish
        if: inputs.confirm == 'publish'
        run: ./mcp-publisher publish server.json

      - name: Verify from the registry
        if: inputs.confirm == 'publish'
        run: |
          python3 - <<'VERIFY'
          import json, os, sys, time, urllib.parse, urllib.request
          name = os.environ['SERVER_NAME']
          local = json.load(open('server.json'))
          url = 'https://registry.modelcontextprotocol.io/v0/servers/' + urllib.parse.quote(name, safe='') + '/versions/latest'
          for attempt in range(1, 13):
              time.sleep(min(5 * attempt, 45))
              try:
                  body = json.loads(urllib.request.urlopen(url, timeout=60).read())
              except Exception as exc:
                  print(f'attempt {attempt}: {exc!r}'); continue
              srv = body.get('server', {})
              meta = body.get('_meta', {}).get('io.modelcontextprotocol.registry/official', {})
              print(json.dumps({'version': srv.get('version'), 'remotes': srv.get('remotes'), 'status': meta.get('status')}))
              if srv.get('version') == local['version'] and srv.get('remotes') == local['remotes'] and meta.get('status') == 'active':
                  print('verified'); sys.exit(0)
          print('::error::registry does not serve the published entry'); sys.exit(1)
          VERIFY
